<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="PHP Development Lab：20 个独立 PHP 开发实验的在线文档与学习知识地图。">
  <title>PHP Development Lab｜20 个 PHP 独立实验</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="?page=001" aria-label="PHP Development Lab 文档首页">
        <img src="images/logo.svg" alt="COOWIN">
      </a>
    </div>
  </header>

  <div class="mobile-tools" aria-label="移动端文档工具栏">
    <button class="mobile-tool" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 7h14M5 12h14M5 17h14" />
      </svg>
      <span>Menu</span>
    </button>

    <button class="mobile-tool mobile-tool--toc" id="toc-toggle" type="button" aria-controls="mobile-toc-panel" aria-expanded="false">
      <span>快速导航</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m9 6 6 6-6 6" />
      </svg>
    </button>
  </div>

  <div class="docs-layout">
    <aside class="sidebar" id="sidebar" aria-label="文档导航">
      <div class="sidebar-scroll">
        <nav class="docs-nav" id="docs-nav"></nav>
      </div>
    </aside>

    <main class="main-content" id="main-content">
      <article class="doc-article">
        <div class="doc-status" id="doc-status" role="status" aria-live="polite"></div>
        <div class="markdown-body" id="doc-body"></div>
      </article>
    </main>

    <aside class="toc-sidebar" aria-label="当前文档快速导航">
      <div class="toc-card">
        <p class="toc-title">快速导航</p>
        <nav class="toc-list" id="toc-list"></nav>
      </div>
    </aside>
  </div>

  <div class="mobile-toc-panel" id="mobile-toc-panel" aria-hidden="true">
    <div class="mobile-toc-inner">
      <div class="mobile-toc-head">
        <strong>快速导航</strong>
        <button class="mobile-toc-close" id="toc-close" type="button" aria-label="关闭快速导航">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <nav class="mobile-toc-list" id="mobile-toc-list"></nav>
    </div>
  </div>

  <button class="page-mask" id="page-mask" type="button" aria-label="关闭菜单"></button>

  <!-- ============================================================
       文档索引：日常新增、删除、改名、排序、调整分类时，只维护这里。

       title    = 一级目录名称
       children = 二级目录 / Markdown 文档
       page     = docs/ 中的 Markdown 编号，不写 .md

       示例：page: "003" => docs/003.md
       数组顺序 = 左侧导航显示顺序
       ============================================================ -->
  <script>
    window.DOCS_NAV = [
      {
        title: "第一部分：PHP 基础",
        children: [
          { title: "01 PHP 基础输出、变量与数据类型", page: "001" },
          { title: "02 PHP 数组与数据遍历", page: "002" },
          { title: "03 PHP 条件判断与状态显示", page: "003" },
          { title: "04 PHP 循环生成 HTML 内容", page: "004" }
        ]
      },
      {
        title: "第二部分：函数、模块与请求",
        children: [
          { title: "05 PHP 自定义函数与参数", page: "005" },
          { title: "06 PHP 页面模块化", page: "006" },
          { title: "07 PHP GET 参数读取", page: "007" },
          { title: "08 PHP POST 表单提交", page: "008" }
        ]
      },
      {
        title: "第三部分：验证、存储与状态",
        children: [
          { title: "09 PHP 表单验证与安全输出", page: "009" },
          { title: "10 PHP 文件读取与写入", page: "010" },
          { title: "11 PHP JSON 数据读取与保存", page: "011" },
          { title: "12 PHP Session 登录状态", page: "012" }
        ]
      },
      {
        title: "第四部分：浏览器状态与数据库",
        children: [
          { title: "13 PHP Cookie 与用户偏好", page: "013" },
          { title: "14 PHP 文件上传", page: "014" },
          { title: "15 PDO + SQLite 数据库连接", page: "015" },
          { title: "16 PHP + SQLite CRUD", page: "016" }
        ]
      },
      {
        title: "第五部分：安全查询、API 与综合项目",
        children: [
          { title: "17 PDO 预处理与安全查询", page: "017" },
          { title: "18 PHP 数据搜索、排序与分页", page: "018" },
          { title: "19 PHP JSON API", page: "019" },
          { title: "20 PHP Mini Notes 综合迷你项目", page: "020" }
        ]
      }
    ];

    // 默认进入的文档。可修改为任意已存在的 page 编号。
    window.DEFAULT_DOC = "001";
  </script>

  <!-- Marked 本地文件；正文内容变化时无需修改。 -->
  <script src="js/marked.umd.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
