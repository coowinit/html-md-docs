<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="一个由 HTML 导航索引与 Markdown 正文组成的轻量响应式文档站模板。">
  <title>COOWIN 文档中心</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="?page=001" aria-label="COOWIN 文档中心首页">
        <img src="images/logo.svg" alt="COOWIN">
      </a>
    </div>
  </header>

  <div class="mobile-tools" aria-label="移动端文档工具栏">
    <button class="mobile-tool" id="menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M5 7h14M5 12h14M5 17h14" />
      </svg>
      <span>Menu</span>
    </button>

    <button class="mobile-tool mobile-tool--toc" id="toc-toggle" type="button" aria-controls="mobile-toc-panel" aria-expanded="false">
      <span>快速导航</span>
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m9 6 6 6-6 6" />
      </svg>
    </button>
  </div>

  <div class="docs-layout">
    <aside class="sidebar" id="sidebar" aria-label="文档导航">
      <div class="sidebar-scroll">
        <nav class="docs-nav" id="docs-nav"></nav>
      </div>
    </aside>

    <main class="main-content" id="main-content">
      <article class="doc-article">
        <div class="doc-status" id="doc-status" role="status" aria-live="polite"></div>
        <div class="markdown-body" id="doc-body"></div>
      </article>
    </main>

    <aside class="toc-sidebar" aria-label="当前文档快速导航">
      <div class="toc-card">
        <p class="toc-title">快速导航</p>
        <nav class="toc-list" id="toc-list"></nav>
      </div>
    </aside>
  </div>

  <div class="mobile-toc-panel" id="mobile-toc-panel" aria-hidden="true">
    <div class="mobile-toc-inner">
      <div class="mobile-toc-head">
        <strong>快速导航</strong>
        <button class="mobile-toc-close" id="toc-close" type="button" aria-label="关闭快速导航">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <nav class="mobile-toc-list" id="mobile-toc-list"></nav>
    </div>
  </div>

  <button class="page-mask" id="page-mask" type="button" aria-label="关闭菜单"></button>

  <!-- ============================================================
       文档索引：日常新增、删除、改名、排序、调整分类时，只维护这里。

       title    = 一级目录名称
       children = 二级目录 / Markdown 文档
       page     = docs/ 中的 Markdown 编号，不写 .md

       示例：page: "003" => docs/003.md
       数组顺序 = 左侧导航显示顺序
       ============================================================ -->
  <script>
    window.DOCS_NAV = [
      {
        title: "入门指南",
        children: [
          { title: "简介", page: "001" },
          { title: "快速开始", page: "002" },
          { title: "更新日志", page: "003" },
          { title: "创建任务", page: "004" },
          { title: "任务管理", page: "005" },
          { title: "任务对话", page: "006" },
          { title: "结果查看", page: "007" }
        ]
      },
      {
        title: "从入门到精通指南",
        children: [
          { title: "文档组织方法", page: "008" },
          { title: "Markdown 写作规范", page: "009" }
        ]
      },
      {
        title: "平台接入指南",
        children: [
          { title: "GitHub Pages 部署", page: "010" },
          { title: "静态主机部署", page: "011" }
        ]
      },
      {
        title: "账号",
        children: [
          { title: "账号设置", page: "012" },
          { title: "安全建议", page: "013" }
        ]
      },
      {
        title: "联系我们",
        children: [
          { title: "联系我们", page: "014" }
        ]
      }
    ];

    // 默认进入的文档。可修改为任意已存在的 page 编号。
    window.DEFAULT_DOC = "003";
  </script>

  <!-- Marked 本地文件；正文内容变化时无需修改。 -->
  <script src="js/marked.umd.js"></script>
  <script src="js/app.js" defer></script>
</body>
</html>
